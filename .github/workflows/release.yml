# Build an offline package and attach it to a GitHub release when the release is published
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the package to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
        env:
          BASE_PATH: ./
      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mv dist "WebSpectrometer-${TAG}"
          zip -qr "WebSpectrometer-${TAG}.zip" "WebSpectrometer-${TAG}"
          gh release upload "$TAG" "WebSpectrometer-${TAG}.zip" --clobber
