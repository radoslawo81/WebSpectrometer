# Build an offline package and attach it to a GitHub release when the release is published
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create (e.g. v1.0.0); creates the tag, the release and the offline package
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
        env:
          BASE_PATH: ./
      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mv dist "WebSpectrometer2.0-${TAG}"
          zip -qr "WebSpectrometer2.0-${TAG}.zip" "WebSpectrometer2.0-${TAG}"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            gh release upload "$TAG" "WebSpectrometer2.0-${TAG}.zip" --clobber
          else
            notes=".github/release-notes/${TAG}.md"
            [ -f "$notes" ] || notes=/dev/null
            gh release create "$TAG" "WebSpectrometer2.0-${TAG}.zip" --target "$GITHUB_SHA" \
              --title "WebSpectrometer2.0 ${TAG}" --notes-file "$notes" --latest
          fi
